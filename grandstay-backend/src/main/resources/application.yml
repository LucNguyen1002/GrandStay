spring:
  application:
    name: grandstay-backend
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    hikari:
      pool-name: GrandStayPool
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  jackson:
    time-zone: UTC

server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.grandstay: INFO
  structured:
    format:
      console: ${LOG_FORMAT:logstash}

grandstay:
  catalog:
    bootstrap:
      enabled: ${CATALOG_BOOTSTRAP_ENABLED:false}
  policy:
    early-check-in-grace: ${EARLY_CHECK_IN_GRACE:60m}
    late-check-out-grace: ${LATE_CHECK_OUT_GRACE:30m}
    fee-per-started-hour-percent: ${FEE_PER_STARTED_HOUR_PERCENT:10}
    maximum-fee-percent: ${MAXIMUM_FEE_PERCENT:50}
  payment:
    customer:
      deposit-percent: ${CUSTOMER_DEPOSIT_PERCENT:30}
    vnpay:
      enabled: ${VNPAY_ENABLED:false}
      payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
      ipn-url: ${VNPAY_IPN_URL:}
      frontend-result-url: ${VNPAY_FRONTEND_RESULT_URL:http://localhost:3000/payment/vnpay/result}
      query-ip-address: ${VNPAY_QUERY_IP_ADDRESS:127.0.0.1}
      expiration: ${VNPAY_EXPIRATION:15m}
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    bootstrap-admin:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      full-name: ${ADMIN_BOOTSTRAP_FULL_NAME:GrandStay Administrator}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    jwt:
      issuer: ${JWT_ISSUER:grandstay-hms}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
    rate-limit:
      login-attempts: ${LOGIN_RATE_LIMIT:5}
      login-window: ${LOGIN_RATE_WINDOW:1m}
      refresh-attempts: ${REFRESH_RATE_LIMIT:30}
      refresh-window: ${REFRESH_RATE_WINDOW:1m}
      account-failure-limit: ${ACCOUNT_FAILURE_LIMIT:5}
      account-lock-duration: ${ACCOUNT_LOCK_DURATION:15m}
