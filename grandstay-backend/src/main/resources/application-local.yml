spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grandstay}
    username: ${DB_USERNAME:grandstay}
    password: ${DB_PASSWORD:grandstay_local_only}
  jpa:
    show-sql: false

grandstay:
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes-minimum}

server:
  port: ${SERVER_PORT:8081}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
